server:
  port: 8080

spring:
  application:
    name: jlpt-ai-tutor
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

ai:
  rate-limit:
    chat-per-minute: 10
    writing-check-per-day: 30
    conversation-per-day: 10
    explanation-per-day: 50

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

supabase:
  jwt:
    secret: ${SUPABASE_JWT_SECRET:}
  url: ${SUPABASE_URL:}

logging:
  level:
    org.springframework.web.servlet.handler.HandlerMappingIntrospector: ERROR

