services:
  # Spring Boot Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jlpt-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/api/vocabulary/stats || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # React + Vite Frontend Dev Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: jlpt-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: jlpt-network
